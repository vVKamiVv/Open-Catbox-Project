# GitHub Pages: the website (site/, with the launcher's fonts, sky and icon) at the root, and the rust docs under
# rustdoc/

name: Pages

on:
  push:
    branches:
      - master

# one deploy at a time: a second push while one deploys waits instead of failing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: rui314/setup-mold@v1 # we use mold on Linux and rustdoc wants to have a linker for some reason
        if: runner.os == 'Linux'
        with:
          make-default: false
      - name: Install packages (Linux)
        # GStreamer for shin-video's Linux decoder; the runner's libunwind-14-dev conflicts with the libunwind-dev it needs
        run: |
          sudo apt-get update
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y libasound2-dev libudev-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: cargo doc --no-deps
        uses: actions-rs/cargo@v1
        with:
          command: doc
          # the launcher (Tauri) needs GTK/WebKit libraries on Linux; its code is documented in launcher/README.md
          args: --no-deps --document-private-items --workspace --exclude open-catbox-launcher
      - name: Put the website and the docs together
        run: |
          mkdir _site
          cp -r site/. _site/
          cp launcher/ui/sky.js _site/
          cp -r launcher/ui/fonts _site/fonts
          cp launcher/icon.svg _site/favicon.svg
          cp -r target/doc _site/rustdoc
          echo "<meta http-equiv=refresh content=0;url=shin/index.html>" > _site/rustdoc/index.html
      # Set the right file permissions, based on https://github.com/actions/upload-pages-artifact#file-permissions.
      - name: Fix file permissions
        shell: sh
        run: |
          chmod -c -R +rX "_site" |
          while read line; do
              echo "::warning title=Invalid file permissions automatically fixed::$line"
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
