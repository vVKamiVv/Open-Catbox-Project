# The Linux and macOS packages of a release: once the release is published (with the Windows Setup and latest.json
# from launcher/scripts/release.ps1), this builds the AppImage, .deb and .rpm on Linux and the .dmg (and the updater's
# .app.tar.gz) on macOS, signs the update files with the updater key, uploads them to the release under stable names,
# and adds their entries to the release's latest.json.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, the updater key that release.ps1 uses.

name: Release for Linux and macOS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build for (e.g. v0.3.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  linux:
    # the oldest supported Ubuntu, so the AppImage runs on older systems too
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Packages
        run: |
          sudo apt-get update
          # the runner's libunwind-14-dev conflicts with libunwind-dev, which GStreamer's dev package needs
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - uses: Swatinem/rust-cache@v2
      - name: The game, for the bundler
        run: |
          cargo build --release -p shin
          mkdir -p launcher/binaries
          cp target/release/shin launcher/binaries/shin-x86_64-unknown-linux-gnu
      - name: AppImage, .deb and .rpm
        working-directory: launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # bundle.linux.json: packaging only, so plain builds need no copy of shin in binaries/
        run: npx --yes @tauri-apps/cli@2 build --config bundle.linux.json --bundles appimage,deb,rpm
      - name: Stable names
        run: |
          mkdir out
          b=target/release/bundle
          cp $b/appimage/*.AppImage out/OpenCatbox-x86_64.AppImage
          cp $b/appimage/*.AppImage.sig out/OpenCatbox-x86_64.AppImage.sig
          cp $b/deb/*.deb out/OpenCatbox-amd64.deb
          cp $b/deb/*.deb.sig out/OpenCatbox-amd64.deb.sig
          cp $b/rpm/*.rpm out/OpenCatbox-x86_64.rpm
          cp $b/rpm/*.rpm.sig out/OpenCatbox-x86_64.rpm.sig
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: Swatinem/rust-cache@v2
      - name: The game for Apple Silicon and Intel, for the bundler
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release -p shin --target aarch64-apple-darwin
          cargo build --release -p shin --target x86_64-apple-darwin
          mkdir -p launcher/binaries
          lipo -create -output launcher/binaries/shin-universal-apple-darwin \
            target/aarch64-apple-darwin/release/shin target/x86_64-apple-darwin/release/shin
      - name: The app and the .dmg (unsigned; ad hoc signature only)
        working-directory: launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 build --config bundle.macos.json --target universal-apple-darwin --bundles app,dmg
      - name: Stable names
        run: |
          mkdir out
          b=target/universal-apple-darwin/release/bundle
          cp $b/dmg/*.dmg out/OpenCatbox-macOS.dmg
          cp $b/macos/*.app.tar.gz out/OpenCatbox-macOS.app.tar.gz
          cp $b/macos/*.app.tar.gz.sig out/OpenCatbox-macOS.app.tar.gz.sig
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Upload the packages
        run: gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Add Linux and macOS to latest.json
        run: |
          gh release download "$TAG" --pattern latest.json --dir feed --repo "$GITHUB_REPOSITORY"
          python3 - <<'EOF'
          import json, os
          tag, repo = os.environ["TAG"], os.environ["GITHUB_REPOSITORY"]
          url = lambda name: f"https://github.com/{repo}/releases/download/{tag}/{name}"
          sig = lambda name: open(f"out/{name}.sig").read().strip()
          with open("feed/latest.json") as f:
              feed = json.load(f)
          entry = lambda name: {"signature": sig(name), "url": url(name)}
          feed["platforms"].update({
              # the updater looks for <os>-<arch>-<installer> first, then <os>-<arch>
              "linux-x86_64": entry("OpenCatbox-x86_64.AppImage"),
              "linux-x86_64-appimage": entry("OpenCatbox-x86_64.AppImage"),
              "linux-x86_64-deb": entry("OpenCatbox-amd64.deb"),
              "linux-x86_64-rpm": entry("OpenCatbox-x86_64.rpm"),
              "darwin-aarch64": entry("OpenCatbox-macOS.app.tar.gz"),
              "darwin-x86_64": entry("OpenCatbox-macOS.app.tar.gz"),
          })
          with open("feed/latest.json", "w") as f:
              json.dump(feed, f, indent=2)
          EOF
          gh release upload "$TAG" feed/latest.json --clobber --repo "$GITHUB_REPOSITORY"
