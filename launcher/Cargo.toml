[package]
name = "open-catbox-launcher"
version = "0.1.0"
edition = "2021"
description = "Launcher and first-run setup for the Open Catbox Project"
license = "MPL-2.0"
authors = ["TruEKami"]
repository = "https://github.com/vVKamiVv/Open-Catbox-Project"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", features = ["json"] }
fs4 = "0.13"
