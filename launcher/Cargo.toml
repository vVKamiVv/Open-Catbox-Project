[package]
name = "open-catbox-launcher"
version = "0.2.2"
edition = "2021"
description = "Launcher and first-run setup for the Open Catbox Project"
license = "MPL-2.0"
authors = ["TruEKami"]
repository = "https://github.com/vVKamiVv/Open-Catbox-Project"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", features = ["json"] }
fs4 = "0.13"
aes = "0.8"
ctr = "0.9"
xts-mode = "0.5"
windows-registry = "0.6"

[features]
# Release builds (scripts/release.ps1): shin.exe built in, read at compile time from the path in the
# OPEN_CATBOX_SHIN environment variable, and the front end served from the embedded files as `cargo tauri build` does.
installer = ["tauri/custom-protocol"]
